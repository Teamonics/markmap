<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Mindmap Viewer</title>
  <!--
    Powered by markmap (https://github.com/markmap/markmap)
    MIT License - Copyright (c) 2020 Gerald
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Editor panel */
    .editor-panel {
      width: 40%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #ddd;
      background: #fff;
    }

    .panel-header {
      padding: 8px 16px;
      background: #e8e8e8;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #markdown-input {
      flex: 1;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
      font-size: 14px;
      line-height: 1.6;
      tab-size: 2;
      background: #fafafa;
    }

    /* Mindmap panel */
    .mindmap-panel {
      flex: 1;
      position: relative;
      background: #fff;
    }

    #mindmap {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Toolbar gets placed by markmap-toolbar */
    .mm-toolbar {
      position: absolute;
      bottom: 16px;
      right: 16px;
    }

    button.render-btn {
      padding: 4px 12px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    button.render-btn:hover { background: #3a56d4; }

    /* Responsive: stack on small screens */
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .editor-panel {
        width: 100%;
        height: 45%;
        border-right: none;
        border-bottom: 2px solid #ddd;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Markdown Mindmap Viewer</h1>
      <p>Paste markdown on the left, see your mindmap on the right</p>
    </div>
  </header>

  <div class="container">
    <!-- Editor -->
    <div class="editor-panel">
      <div class="panel-header">
        <span>Markdown Editor</span>
        <button class="render-btn" id="render-btn">Render</button>
      </div>
      <textarea id="markdown-input" spellcheck="false">
# Markmap Viewer

## How to Use
- Paste your markdown here
- Use headings and lists to create hierarchy
- Click **Render** or just start typing

## Features
- Real-time preview
- Interactive mindmap
  - Zoom and pan
  - Click nodes to collapse
- Supports markdown syntax
  - **Bold** and *italic*
  - `inline code`
  - [Links](https://markmap.js.org)

## Example Topics
### Project Planning
- Goals
- Timeline
- Resources

### Study Notes
- Chapter 1
  - Key concepts
  - Summary
- Chapter 2
  - Key concepts
  - Summary
</textarea>
    </div>

    <!-- Mindmap -->
    <div class="mindmap-panel">
      <div class="panel-header">
        <span>Mindmap Output</span>
      </div>
      <svg id="mindmap"></svg>
    </div>
  </div>

  <!-- Load markmap dependencies from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18/dist/style.css" />

  <script>
    (function () {
      const { Transformer } = markmap;
      // markmap-view exposes as window.markmap as well; we access Markmap from it
      const { Markmap, deriveOptions } = markmap;
      const { Toolbar } = markmap;

      const textarea = document.getElementById('markdown-input');
      const svgEl = document.getElementById('mindmap');
      const renderBtn = document.getElementById('render-btn');

      // Create the transformer (markdown -> tree)
      const transformer = new Transformer();

      // Create the markmap instance on the SVG
      const mm = Markmap.create(svgEl, { duration: 300 });

      // Add the toolbar
      if (Toolbar) {
        const toolbar = Toolbar.create(mm);
        toolbar.el.classList.add('mm-toolbar');
        document.querySelector('.mindmap-panel').appendChild(toolbar.el);
      }

      // Render function
      function renderMarkmap() {
        const md = textarea.value;
        const { root, features } = transformer.transform(md);
        const options = deriveOptions(features);
        mm.setData(root, options);
        mm.fit();
      }

      // Debounce helper for auto-render while typing
      let timer;
      function debounce(fn, delay) {
        clearTimeout(timer);
        timer = setTimeout(fn, delay);
      }

      // Auto-render on typing (with 400ms debounce)
      textarea.addEventListener('input', function () {
        debounce(renderMarkmap, 400);
      });

      // Also render on button click
      renderBtn.addEventListener('click', renderMarkmap);

      // Initial render
      renderMarkmap();
    })();
  </script>

</body>
</html>

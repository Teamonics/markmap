<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Mindmap Viewer</title>
  <!--
    Powered by markmap (https://github.com/markmap/markmap)
    MIT License - Copyright (c) 2020 Gerald
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji',
        'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #333;
      overflow: hidden;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header p { font-size: 0.8rem; opacity: 0.6; }

    .container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Editor panel */
    .editor-panel {
      width: 40%;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e0e0e0;
      background: #fff;
    }

    .panel-header {
      padding: 6px 12px;
      background: #f4f4f5;
      border-bottom: 1px solid #e0e0e0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #markdown-input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      outline: none;
      resize: none;
      font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Menlo", monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
      background: #fafafa;
      color: #24292e;
    }

    /* Mindmap panel */
    .mindmap-panel {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .mindmap-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #mindmap {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Toolbar positioning */
    .mm-toolbar {
      position: absolute;
      bottom: 12px;
      right: 12px;
    }

    /* Loading state */
    .loading-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #999;
      font-size: 0.9rem;
    }

    .loading-msg.hidden { display: none; }

    /* Responsive: stack on small screens */
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .editor-panel {
        width: 100%;
        height: 40%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Markdown Mindmap Viewer</h1>
      <p>Paste markdown on the left, see your mindmap on the right</p>
    </div>
  </header>

  <div class="container">
    <!-- Editor -->
    <div class="editor-panel">
      <div class="panel-header">
        <span>Markdown</span>
      </div>
      <textarea id="markdown-input" spellcheck="false">
# Markmap Viewer

## How to Use
- Paste your markdown here
- Use headings and lists to create hierarchy
- The mindmap updates as you type

## Features
- Real-time preview
- Interactive mindmap
  - Zoom and pan
  - Click nodes to collapse/expand
- Supports markdown syntax
  - **Bold** and *italic*
  - `inline code`
  - [Links](https://markmap.js.org)

## Example Topics
### Project Planning
- Goals
- Timeline
- Resources

### Study Notes
- Chapter 1
  - Key concepts
  - Summary
- Chapter 2
  - Key concepts
  - Summary
</textarea>
    </div>

    <!-- Mindmap -->
    <div class="mindmap-panel">
      <div class="panel-header">
        <span>Mindmap</span>
      </div>
      <div class="mindmap-wrap">
        <div class="loading-msg" id="loading-msg">Loading markmap...</div>
        <svg id="mindmap"></svg>
      </div>
    </div>
  </div>

  <!-- Load markmap dependencies from CDN (correct paths from package.json jsdelivr fields) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18/dist/browser/index.iife.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18/dist/style.css" />

  <script>
    (function () {
      var loadingMsg = document.getElementById('loading-msg');

      // Verify libraries loaded
      if (!window.markmap || !window.markmap.Transformer || !window.markmap.Markmap) {
        loadingMsg.textContent = 'Failed to load markmap libraries. Please refresh.';
        return;
      }
      loadingMsg.classList.add('hidden');

      var Transformer = markmap.Transformer;
      var Markmap = markmap.Markmap;
      var deriveOptions = markmap.deriveOptions;
      var Toolbar = markmap.Toolbar;

      var textarea = document.getElementById('markdown-input');
      var svgEl = document.getElementById('mindmap');

      // Create the transformer (markdown -> tree data)
      var transformer = new Transformer();

      // Create the markmap instance on the SVG
      var mm = Markmap.create(svgEl, { duration: 300 });

      // Add the toolbar (zoom controls)
      if (Toolbar) {
        var toolbar = Toolbar.create(mm);
        toolbar.el.classList.add('mm-toolbar');
        document.querySelector('.mindmap-wrap').appendChild(toolbar.el);
      }

      // Render function: transform markdown and update the mindmap
      function renderMarkmap() {
        var md = textarea.value;
        var result = transformer.transform(md);
        var root = result.root;
        var features = result.features;

        // Load any extra assets needed (e.g. KaTeX for math, highlight.js for code)
        var keys = Object.keys(features);
        if (keys.length) {
          var assets = transformer.getAssets(keys);
          if (assets.styles) markmap.loadCSS(assets.styles);
          if (assets.scripts) markmap.loadJS(assets.scripts);
        }

        var options = deriveOptions(features);
        mm.setData(root, options);
        mm.fit();
      }

      // Debounce helper for auto-render while typing
      var timer;
      textarea.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(renderMarkmap, 300);
      });

      // Initial render
      renderMarkmap();
    })();
  </script>

</body>
</html>
